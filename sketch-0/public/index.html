<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketch 0 — Find Your Scene</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; }
    button { margin-top: 8px; padding: 8px 16px; font: inherit; cursor: pointer; }
    .notice { font-size: 0.85em; color: #555; background: #f3f3f3; padding: 8px; border-radius: 4px; }
    .event { border-top: 1px solid #ddd; padding: 12px 0; }
    .meta { color: #666; font-size: 0.9em; }
    .reason { font-style: italic; }
    .social { color: #444; font-size: 0.9em; margin-top: 4px; }
    .social.friends { color: #1a6b3a; font-weight: 600; }
    button.going { margin-top: 8px; padding: 4px 12px; font-size: 0.9em; }
    .error { color: #b00020; }
    .trip-inputs { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .trip-inputs label { display: flex; flex-direction: column; font-size: 0.9em; }
    select { font: inherit; padding: 4px; }
    .travel { font-size: 0.9em; margin-top: 4px; }
    .travel.over { color: #b00020; }
    .badge { display: inline-block; font-size: 0.8em; background: #e3f1e8; color: #1a6b3a; padding: 0 6px; border-radius: 4px; margin-left: 6px; }
  </style>
</head>
<body>
  <h1>Find your scene</h1>
  <p>Tell us what you're into and we'll find Toronto events worth your time, where you'll meet people who share your interests.</p>

  <label for="interests">Your interests</label>
  <textarea id="interests" rows="3" placeholder="e.g. jazz, climbing, zines, vegan food"></textarea>

  <div class="trip-inputs">
    <label>Starting from
      <select id="origin">
        <option value="">Pick a starting point</option>
        <option value="union">Downtown (Union)</option>
        <option value="finch">North York (Finch)</option>
        <option value="kennedy">Scarborough (Kennedy)</option>
        <option value="kipling">Etobicoke (Kipling)</option>
      </select>
    </label>
    <label>Max travel time
      <select id="max-minutes">
        <option value="15">15 min</option>
        <option value="30" selected>30 min</option>
        <option value="45">45 min</option>
        <option value="60">1 hour</option>
        <option value="">Any</option>
      </select>
    </label>
  </div>
  <button id="go">Find events</button>

  <p class="notice" id="mode">
    Matches are picked by an AI model and may be wrong. Events, reviews, organizers, attendees, friends and travel times are made-up sample data.
  </p>

  <div id="results"></div>

  <script src="app.js"></script>
</body>
</html>
