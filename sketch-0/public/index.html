<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sketch 0 — Event Matcher</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; }
    button { margin-top: 8px; padding: 8px 16px; font: inherit; cursor: pointer; }
    .notice { font-size: 0.85em; color: #555; background: #f3f3f3; padding: 8px; border-radius: 4px; }
    .event { border-top: 1px solid #ddd; padding: 12px 0; }
    .meta { color: #666; font-size: 0.9em; }
    .reason { font-style: italic; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>What's on for you?</h1>
  <p>Tell us what you're into and we'll find Toronto events that match.</p>

  <label for="interests">Your interests</label>
  <textarea id="interests" rows="3" placeholder="e.g. jazz, climbing, zines, vegan food"></textarea>
  <button id="go">Find events</button>

  <p class="notice" id="mode">
    Matches are picked by an AI model and may be wrong. Events are made-up sample data.
  </p>

  <div id="results"></div>

  <script src="app.js"></script>
</body>
</html>
